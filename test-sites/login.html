    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input { width: 100%; padding: 0.8rem 1rem; border: 2px solid #e8eaed; border-radius: 10px; font-size: 0.95rem; transition: all 0.2s; }
    .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
    .form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #667eea; }
    .checkbox-group label { font-size: 0.85rem; color: #666; text-transform: none; letter-spacing: 0; font-weight: 400; }
    .forgot-link { color: #667eea; text-decoration: none; font-size: 0.85rem; font-weight: 500; }

    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
    .divider { text-align: center; margin: 1.5rem 0; position: relative; }
    .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e8eaed; }
    .divider span { background: #fff; padding: 0 1rem; position: relative; color: #999; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }

    .btn-social { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.7rem; border: 2px solid #e8eaed; border-radius: 10px; background: #fff; font-size: 0.85rem; font-weight: 500; color: #333; cursor: pointer; transition: all 0.2s; }
    .btn-social:hover { border-color: #ccc; background: #f8f9fa; }
    .btn-social .icon { font-size: 1.1rem; }
    .signup-link { text-align: center; font-size: 0.9rem; color: #666; }
    .signup-link a { color: #667eea; text-decoration: none; font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }

    .error-state.visible { display: block; }
    .hidden-fields { position: absolute; left: -9999px; opacity: 0; }

<body>
  <div class="login-card">

    <form id="login-form" data-testid="login-form" autocomplete="on">

      </div>
      <div class="form-row">
        <div class="checkbox-group">
          <input type="checkbox" id="remember" name="remember_me" checked data-testid="remember-checkbox">
          <label for="remember">Remember me</label>

      <button type="submit" class="btn-login" data-testid="login-button">Sign In</button>

      </button>
    </div>

    <div class="signup-link">
      Don't have an account? <a href="#">Create one</a>
    </div>
  </div>

  <div class="hidden-fields">
    <input type="hidden" name="session_token" value="sess_8f3k2m9x4p1n7b5v" data-testid="session-token">
